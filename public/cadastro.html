<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Cadastro</title>
<link rel="stylesheet" href="form.css" />
<link rel="icon" href="src/logo.ico" />
</head>
<body>

<div class="form-container">
  <div class="form-box">

    <img src="src/logo.png" alt="logo" class="logo" />
    <h2>Crie sua conta</h2>

    <form id="cadastroForm">

      <div class="input-group">
        <input type="text" id="nome" required />
        <label for="nome">Nome Completo</label>
      </div>

      <div class="input-group">
        <input type="text" id="cpf" required />
        <label for="cpf">CPF</label>
      </div>

      <div class="input-group">
        <input type="email" id="email" required />
        <label for="email">Email</label>
      </div>

      <div class="input-group">
        <input type="password" id="senha" required />
        <label for="senha">Senha</label>
      </div>

      <button class="form-btn" type="submit">Cadastrar</button>

      <div class="links">
        <p>Já tem uma conta? <a href="login.html">Entrar</a></p>
      </div>

    </form>
  </div>
</div>

<!-- MÁSCARA DO CPF -->
<script>
  const cpfInput = document.getElementById("cpf");
  cpfInput.addEventListener("input", function () {
    let value = cpfInput.value.replace(/\D/g, "");
    if (value.length > 3 && value.length <= 6)
      value = value.replace(/(\d{3})(\d{1,})/, "$1.$2");
    else if (value.length > 6 && value.length <= 9)
      value = value.replace(/(\d{3})(\d{3})(\d{1,})/, "$1.$2.$3");
    else if (value.length > 9)
      value = value.replace(/(\d{3})(\d{3})(\d{3})(\d{1,})/, "$1.$2.$3-$4");
    cpfInput.value = value;
  });
</script>

<!-- FIREBASE CADASTRO -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
  import { getAuth, createUserWithEmailAndPassword, sendEmailVerification } 
    from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
  import { getFirestore, doc, setDoc } 
    from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyCF6IX5j5o1QFTqALBNXHyJ_Fr7B0Rwr_U",
    authDomain: "atlaspay-f5cad.firebaseapp.com",
    projectId: "atlaspay-f5cad",
    storageBucket: "atlaspay-f5cad.firebasestorage.app",
    messagingSenderId: "195082315144",
    appId: "1:195082315144:web:16ba1626f99bf742ac463d",
    measurementId: "G-2FW6B8CM47"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);

  // Evento do formulário de cadastro
  document.getElementById("cadastroForm").addEventListener("submit", async (e) => {
    e.preventDefault();

    const nome = document.getElementById("nome").value.trim();
    const cpf = document.getElementById("cpf").value.trim().replace(/\D/g, ""); // CPF sem máscara
    const email = document.getElementById("email").value.trim();
    const senha = document.getElementById("senha").value;

    try {
      // Criar usuário no Auth
      const cred = await createUserWithEmailAndPassword(auth, email, senha);

      // Enviar e-mail de verificação
      await sendEmailVerification(cred.user);

      // Salvar dados no Firestore
      await setDoc(doc(db, "usuarios", cred.user.uid), {
        nome,
        cpf,
        email
      });

      alert("Cadastro realizado! Verifique seu e-mail para continuar.");

      window.location.href = "login.html";

    } catch (error) {
      alert("Erro ao cadastrar: " + error.message);
      console.log(error);
    }
  });
</script>

</body>
</html>
