<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="form.css">
    <link rel="icon" href="src/logo.ico" type="image/x-icon">
</head>
<body>

    <div class="form-container">
        <div class="form-box">

            <img src="src/logo.png" alt="logo" class="logo">

            <h2>Entrar na sua conta</h2>

            <form id="loginForm">

                <div class="input-group">
                    <input type="text" id="cpf" required>
                    <label for="cpf">CPF</label>
                </div>

                <div class="input-group">
                    <input type="password" id="senha" required>
                    <label for="senha">Senha</label>
                </div>

                <button class="form-btn" type="submit">Entrar</button>

                <div class="links">
                    <a href="#">Esqueceu sua senha?</a>
                    <p>Não tem conta? <a href="cadastro.html">Cadastre-se</a></p>
                </div>

            </form>
        </div>
    </div>

<script>
// MÁSCARA CPF
const cpfInput = document.getElementById('cpf');
cpfInput.addEventListener('input', function () {
    let value = cpfInput.value.replace(/\D/g, '');

    if (value.length > 3 && value.length <= 6)
        value = value.replace(/(\d{3})(\d{1,})/, '$1.$2');
    else if (value.length > 6 && value.length <= 9)
        value = value.replace(/(\d{3})(\d{3})(\d{1,})/, '$1.$2.$3');
    else if (value.length > 9)
        value = value.replace(/(\d{3})(\d{3})(\d{3})(\d{1,})/, '$1.$2.$3-$4');

    cpfInput.value = value;
});
</script>

<!-- FIREBASE LOGIN -->
<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword } 
        from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
    import { getFirestore, collection, query, where, getDocs } 
        from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyCF6IX5j5o1QFTqALBNXHyJ_Fr7B0Rwr_U",
        authDomain: "atlaspay-f5cad.firebaseapp.com",
        projectId: "atlaspay-f5cad",
        storageBucket: "atlaspay-f5cad.firebasestorage.app",
        messagingSenderId: "195082315144",
        appId: "1:195082315144:web:16ba1626f99bf742ac463d",
        measurementId: "G-2FW6B8CM47"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    document.getElementById("loginForm").addEventListener("submit", async (e) => {
        e.preventDefault();

        const cpfDigitado = document.getElementById("cpf").value.replace(/\D/g, "");
        const senha = document.getElementById("senha").value;

        try {
            // 1️⃣ Buscar usuário pelo CPF
            const q = query(
                collection(db, "usuarios"),
                where("cpf", "==", cpfDigitado)
            );

            const resultado = await getDocs(q);

            if (resultado.empty) {
                alert("CPF não encontrado.");
                return;
            }

            // PEGAR DADOS DO USUÁRIO
            const dados = resultado.docs[0].data();
            const emailUsuario = dados.email;

            // 2️⃣ Logar usando email + senha
            const cred = await signInWithEmailAndPassword(auth, emailUsuario, senha);

            // 3️⃣ Checar verificação de e-mail
            if (!cred.user.emailVerified) {
                alert("Seu e-mail ainda não foi verificado. Verifique sua caixa de entrada.");
                return;
            }

            // 4️⃣ Redirecionar
            window.location.href = "home.html";

        } catch (error) {
            alert("Erro ao fazer login: " + error.message);
            console.error(error);
        }
    });
</script>

</body>
</html>
